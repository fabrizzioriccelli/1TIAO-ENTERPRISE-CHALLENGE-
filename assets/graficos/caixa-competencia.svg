<text x="24.0" y="52.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Competência distribui seguro e IPVA pelos meses de vigência; caixa registra a data do pagamento.</text>
