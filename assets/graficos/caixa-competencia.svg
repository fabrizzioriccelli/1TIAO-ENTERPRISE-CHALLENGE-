<title id="t">Caixa e competência da EMP-B</title>
<desc id="d">As duas séries ficam próximas, exceto em abril de 2026, quando o caixa sobe para cerca de R$ 370 mil pela renovação do seguro paga à vista, enquanto a competência fica em cerca de R$ 182 mil.</desc>
